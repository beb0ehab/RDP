      fetchpriority="high"
    />
    <!-- Heading font used above the fold — fetch it early. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2"
    />

    <script type="application/ld+json">

        "@context": "https://schema.org",

        "sameAs": ["https://linkedin.com/in/adly-ehab-dev"]
      }
    </script>

    <!-- Apply saved theme/language before first paint (prevents a flash). -->
    <script>
      (function () {
        var d = document.documentElement;
        var theme = null;
        var lang = null;
        try {
          theme = localStorage.getItem('theme');
          lang = localStorage.getItem('lang');
        } catch (e) {}
        // The design is dark-first: dark unless the visitor picked light.
        if (theme !== 'light') theme = 'dark';
        if (theme === 'dark') d.classList.add('dark');
        d.style.colorScheme = theme;
        if (lang === 'ar') {
          d.lang = 'ar';
          d.dir = 'rtl';
        }
      })();
    </script>
