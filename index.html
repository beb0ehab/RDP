      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"

    <!-- Apply saved theme/language before first paint (prevents a flash). -->
    <script>
      (function () {
        var d = document.documentElement;
        var theme = null;
        var lang = null;
        try {
          theme = localStorage.getItem('theme');
          lang = localStorage.getItem('lang');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        if (theme === 'dark') d.classList.add('dark');
        d.style.colorScheme = theme;
        if (lang === 'ar') {
          d.lang = 'ar';
          d.dir = 'rtl';
        }
      })();
    </script>
