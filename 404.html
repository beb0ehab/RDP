<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Adly Ehab</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f7f6f2;
        --ink: #111412;
        --muted: #545c58;
        --accent: #0a7a68;
        --accent-ink: #fff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0e0d;
          --ink: #ecefea;
          --muted: #a0aaa5;
          --accent: #34d3b2;
          --accent-ink: #061a16;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      .code {
        font-size: clamp(4rem, 18vw, 8rem);
        font-weight: 800;
        line-height: 1;
        margin: 0;
        letter-spacing: -0.04em;
      }
      .code span {
        color: var(--accent);
      }
      p {
        color: var(--muted);
        margin: 1rem 0 0;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 2rem;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="code">4<span>0</span>4</h1>
      <p>This page doesn't exist.<br /><span lang="ar" dir="rtl">هذه الصفحة غير موجودة.</span></p>
      <a href="%BASE_URL%">Go to the homepage · الرئيسية</a>
    </main>
  </body>
</html>
