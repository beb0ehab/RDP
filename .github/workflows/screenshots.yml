name: Capture screenshots

# Takes real screenshots of every project with a live `url` (see scripts/screenshots.mjs)
# and commits them back to the branch. Run it from the Actions tab whenever a live site changes.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/screenshots.mjs
      - .github/workflows/screenshots.yml

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects src/data/screenshots.json
          if git diff --cached --quiet; then
            echo "No screenshot changes."
          else
            git commit -m "Update project screenshots"
            git push
          fi
