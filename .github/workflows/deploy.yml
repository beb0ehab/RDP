name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Redeploy after the screenshot workflow commits new images.
  workflow_run:
    workflows: ['Capture screenshots']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Custom domain (public/CNAME present) or <user>.github.io repo → base "/".
      # Otherwise the base path is the repo name, e.g. "/RDP/".
      - name: Build
        run: |
          if [ -f public/CNAME ] || [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export BASE_PATH=/
          else
            export BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          echo "Building with base $BASE_PATH"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
